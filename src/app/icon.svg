<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" role="img" aria-label="summario">
  <!--
    The brand mark is the accented "i" of summar·i·o, and its stem is deliberately
    the same shape as the accent stripe every box in the generated document carries.
    Deep violet ground so it holds up against a light or a dark browser tab; the
    amber dot is the intuition box, which is the one element that opens every
    section of every guide.
  -->
  <rect width="32" height="32" rx="7.5" fill="#2e2058"/>
  <circle cx="16" cy="8.6" r="3.3" fill="#e8a33d"/>
  <rect x="13" y="14" width="6" height="12.4" rx="3" fill="#faf8f5"/>
</svg>
